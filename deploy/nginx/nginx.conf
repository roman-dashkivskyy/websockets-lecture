# Docker's embedded DNS: a recreated backend container (new IP) is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s;

# WebSocket handshake: pass "Connection: upgrade" on only when the client asked for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The WebSocket URL carries the JWT (?token=...), so never log query strings.
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream backend {
    zone backend 64k;   # required for "resolve"
    server backend:8080 resolve;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log no_query;

    # /api/... -> the backend, including the WebSocket at /api/ws
    location /api/ {
        proxy_pass http://backend;
        # $http_host keeps the port (localhost:8080). The WebSocket same-origin check compares it with the
        # browser's Origin header; $host would drop the port and the handshake would fail with 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket: HTTP/1.1 plus the Upgrade/Connection headers, otherwise nginx drops them
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx closes a connection that is silent for 60 s by default; sockets may be quiet much longer
        proxy_read_timeout 1h;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
