# Docker's embedded DNS: a recreated backend container (new IP) is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s;

# WebSocket handshake: pass "Connection: upgrade" on only when the client asked for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The WebSocket URL carries the JWT (?token=...), so never log query strings.
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# The load balancer: round-robin over all instances.
# Sticky sessions (ip_hash) are left out on purpose: they keep ONE client on one instance, but Alice and Bob
# are different clients on different instances, so pushes still get lost. On one laptop every tab has the
# same IP, so ip_hash would even put everybody on the same instance and hide the problem in the demo.
upstream backends {
    zone backends 64k;   # shared by all nginx workers: one round-robin counter, and required for "resolve"
    server backend-1:8080 resolve;
    server backend-2:8080 resolve;
    server backend-3:8080 resolve;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log no_query;
    # PUT /api/lists/mine can carry thousands of items; nginx's default limit is 1 MB (then 413).
    client_max_body_size 20m;

    # Shared by both /api locations below. nginx inherits proxy_set_header only if a location sets NONE of
    # its own: adding even one proxy_set_header inside a location drops ALL of these, Upgrade/Connection too.
    # $http_host keeps the port (localhost:8080). The WebSocket same-origin check compares it with the
    # browser's Origin header; $host would drop the port and the handshake would fail with 403.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # WebSocket: HTTP/1.1 plus the Upgrade/Connection headers, otherwise nginx drops them
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # nginx closes a connection that is silent for 60 s by default; sockets may be quiet much longer
    proxy_read_timeout 1h;

    # /api/... -> any instance (round-robin), including the WebSocket at /api/ws
    location /api/ {
        proxy_pass http://backends;
    }

    # /i/2/api/... -> exactly backend-2 (also /i/2/api/ws).
    # Keep [1-3] in sync with the backend services in docker-compose.yml;
    # other numbers fall through to the SPA instead of a 502.
    location ~ ^/i/(?<n>[1-3])(?<rest>/api/.*)$ {
        proxy_pass http://backend-$n:8080$rest$is_args$args;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
