name: websockets-lecture

# Phase 1: one backend instance. Several instances behind a load balancer come in phase 3.
# All passwords and secrets here are for the demo only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: websockets
      POSTGRES_USER: websockets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-websockets}
    ports:
      - "127.0.0.1:5433:5432"   # local dev loop only (localhost); 5432 is often taken on the host
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websockets -d websockets"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    image: websockets-lecture/backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/websockets
      DB_USER: websockets
      DB_PASSWORD: ${DB_PASSWORD:-websockets}
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-0123456789abcdef}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: ../frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
