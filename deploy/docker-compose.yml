name: websockets-lecture

# Three backend instances behind nginx (round-robin), sharing one database, and RabbitMQ so every
# instance hears every change (as small "specs": processor name + ids).
# All passwords and secrets here are for the demo only.

# Settings every backend instance shares.
x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://postgres:5432/websockets
  DB_USER: websockets
  DB_PASSWORD: ${DB_PASSWORD:-websockets}
  # The same secret on every instance: a token issued by one instance is accepted by all of them.
  JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-0123456789abcdef}
  RABBIT_HOST: rabbitmq
  RABBIT_USER: websockets
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:-websockets}
  # REALTIME_LOG_LEVEL=DEBUG logs every published spec with its size (e.g. "Published LIST_CHANGED spec (13 bytes)")
  LOGGING_LEVEL_UA_KHPI_WEBSOCKETS_REALTIME: ${REALTIME_LOG_LEVEL:-INFO}

x-backend: &backend
  build: ../backend
  image: websockets-lecture/backend:local
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: websockets
      POSTGRES_USER: websockets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-websockets}
    ports:
      - "127.0.0.1:5433:5432"   # local dev loop only (localhost); 5432 is often taken on the host
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websockets -d websockets"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: websockets
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-websockets}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP, for the local dev loop
      - "127.0.0.1:15672:15672"   # management UI for the demo: http://localhost:15672 (websockets / websockets)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: Alpha
  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: Bravo
  backend-3:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: Charlie

  web:
    build:
      context: ../frontend
      args:
        VITE_BACKEND_COUNT: 3   # keep in sync with backend-N above and [1-3] in nginx.conf
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }
      backend-3: { condition: service_healthy }

volumes:
  postgres-data:
